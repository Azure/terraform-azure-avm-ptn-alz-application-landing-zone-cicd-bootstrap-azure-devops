---
parameters:
  - name: environments
    type: object
    default: []
  - name: deployments
    type: object
    default: []
  - name: root_module_folder_relative_path
    default: '.'
  - name: bicep_cli_version
    default: 'latest'

stages:
  - stage: validate
    displayName: Validate Bicep
    jobs:
      - job: validate
        displayName: Validate Bicep Syntax
        pool:
          ${{ if eq(parameters.environments[0].agent_pool_type, 'self-hosted') }}:
            name: ${{ parameters.environments[0].agent_pool_name }}
          ${{ if eq(parameters.environments[0].agent_pool_type, 'microsoft-hosted') }}:
            vmImage: ${{ parameters.environments[0].agent_pool_name }}
        steps:
          - task: AzureCLI@2
            displayName: 'Install Bicep CLI'
            inputs:
              azureSubscription: ${{ parameters.environments[0].service_connection_name_plan }}
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                az bicep install
                az bicep version
          - ${{ each deployment in parameters.deployments }}:
            - pwsh: |
                az bicep build --file "${{ parameters.root_module_folder_relative_path }}/${{ deployment.template_file }}"
              displayName: 'Bicep Build - ${{ deployment.name }}'

      - ${{ each environment in parameters.environments }}:
        - deployment: ${{ environment.name }}_validate
          variables:
            - group: ${{ environment.variable_group_name }}
          dependsOn: validate
          displayName: Validate Deployment Stacks for ${{ environment.display_name }}
          pool:
            ${{ if eq(environment.agent_pool_type, 'self-hosted') }}:
              name: ${{ environment.agent_pool_name }}
            ${{ if eq(environment.agent_pool_type, 'microsoft-hosted') }}:
              vmImage: ${{ environment.agent_pool_name }}
          environment: ${{ environment.environment_name }}
          timeoutInMinutes: 0
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    displayName: Checkout Bicep Module
                  - ${{ each deployment in parameters.deployments }}:
                    - task: AzureCLI@2
                      displayName: 'What-If - ${{ deployment.name }}'
                      inputs:
                        azureSubscription: ${{ environment.service_connection_name_plan }}
                        scriptType: pscore
                        scriptLocation: inlineScript
                        inlineScript: |
                          $scope = "${{ coalesce(deployment.scope, 'group') }}"
                          $templateFile = "${{ parameters.root_module_folder_relative_path }}/${{ deployment.template_file }}"
                          $arguments = @("stack", $scope, "create", "--deny-settings-mode", "none", "--action-on-unmanage", "detachAll", "--yes")

                          switch($scope) {
                            "group" { $arguments += @("--resource-group", "${{ deployment.resource_group }}", "--name", "${{ deployment.name }}") }
                            "sub"   { $arguments += @("--location", "${{ deployment.location }}", "--name", "${{ deployment.name }}") }
                            "mg"    { $arguments += @("--location", "${{ deployment.location }}", "--management-group-id", "${{ deployment.management_group_id }}", "--name", "${{ deployment.name }}") }
                          }

                          $arguments += @("--template-file", $templateFile)
                          $paramsFile = "${{ deployment.parameters_file }}"
                          if($paramsFile -ne "") {
                            $arguments += @("--parameters", "@${{ parameters.root_module_folder_relative_path }}/$paramsFile")
                          }
                          $arguments += "--what-if"
                          Write-Host "Running: az $arguments"
                          az @arguments
                          if($LASTEXITCODE -ne 0) { throw "What-If failed for: ${{ deployment.name }}" }
